[model]
context_length = 512
d_model = 512
n_heads = 8
n_layers = 8
ff_multiplier = 4
dropout = 0.0
position = "rope"
norm = "rmsnorm"
feed_forward = "swiglu"
attention = "sdpa"
kv_heads = 2

[training]
seed = 1337
batch_size = 32
steps = 24000
eval_interval = 1000
learning_rate = 0.0006
min_learning_rate = 0.00006
warmup_steps = 500
weight_decay = 0.1
grad_clip = 1.0

[tokenizer]
vocab_size = 8192
min_frequency = 2
